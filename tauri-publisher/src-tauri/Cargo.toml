[package]
name = "tauri-publisher"
version = "0.1.0"
description = "Glowstone Newsroom Blog Publisher"
authors = ["glowingstone"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "1", features = [] }

[dependencies]
tauri = { version = "1", features = ["shell-open"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.21"

[features]
custom-protocol = ["tauri/custom-protocol"]
